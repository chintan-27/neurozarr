name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs]"
      - run: pytest -m "not slow"
      - run: mypy
      - run: python -m build
      - run: sphinx-build -W -b html docs docs/_build
        env:
          NEUROZARR_DOCS_OFFLINE: "1"
