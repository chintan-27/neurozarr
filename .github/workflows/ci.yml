name: CI

on:
  push:
  pull_request:

# Only one Pages deployment at a time; a newer push wins rather than queuing
# behind an older one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    # The suite runs on every supported interpreter because the one failure that has
    # actually cost us time -- a deadlock in the icechunk/zarr threading bridge -- was
    # intermittent. A single local run cannot rule that out; repeated CI runs can.
    # pytest-timeout (timeout = 30 in pyproject) turns any recurrence into a failure
    # with a traceback instead of a hung job.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest

  quality:
    # Type checking, packaging and docs are interpreter-independent, so they run once
    # on the floor of requires-python rather than four times.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs]"
      - run: pytest
      - run: mypy
      - run: python -m build
      - run: sphinx-build -W -b html docs docs/_build
        env:
          NEUROZARR_DOCS_OFFLINE: "1"

  docs:
    # Publishes docs/_build to GitHub Pages -- only from a real push to main,
    # never from a PR or another branch, and only once quality (which is what
    # actually builds the docs) has passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[docs]"
      - run: sphinx-build -b html docs docs/_build
        env:
          NEUROZARR_DOCS_OFFLINE: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build
      - uses: actions/deploy-pages@v4
        id: deployment
