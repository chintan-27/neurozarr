[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bidszarr"
version = "0.1.0"
description = "Convert neural/behavioral recordings into a BIDS-structured Zarr/Icechunk store"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chintan Acharya" }]
keywords = ["bids", "zarr", "icechunk", "neuroscience", "ieeg", "eeg", "dbs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "icechunk",
    "pandas",
    "mne",
    "zarr",
    "numpy",
]

[project.scripts]
bidszarr = "bidszarr.cli:main"

[project.optional-dependencies]
dev = ["pytest", "tqdm"]
docs = ["sphinx", "myst-parser", "furo"]

[tool.setuptools.packages.find]
include = ["bidszarr*"]

[tool.setuptools.package-data]
bidszarr = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
