[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neurozarr"
version = "0.2.0"
description = "Put neural/behavioral recordings into a versioned, cloud-ready Zarr/Icechunk store"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chintan Acharya" }]
keywords = ["zarr", "icechunk", "neuroscience", "ieeg", "eeg", "dbs", "bids"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "icechunk>=2.1,<2.2",
    "pandas>=2.2,<4",
    "mne>=1.10,<2",
    "zarr>=3.2,<4",
    "numpy>=2,<3",
]

[project.urls]
Documentation = "https://github.com/chintan/neurozarr#readme"
Repository = "https://github.com/chintan/neurozarr"
Issues = "https://github.com/chintan/neurozarr/issues"
Changelog = "https://github.com/chintan/neurozarr/blob/main/CHANGELOG.md"

[project.scripts]
neurozarr = "neurozarr.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout", "tqdm", "mypy", "pandas-stubs", "build", "nibabel"]
docs = ["sphinx", "myst-parser", "furo"]
imaging = ["nibabel"]

[tool.setuptools.packages.find]
include = ["neurozarr*"]

[tool.setuptools.package-data]
neurozarr = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30

[tool.mypy]
# No python_version pin: numpy's bundled stubs use 3.12+ syntax, so checking
# against the floor of requires-python fails inside numpy rather than here.
files = ["neurozarr"]
# The package ships py.typed, so its own annotations must hold up.
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
